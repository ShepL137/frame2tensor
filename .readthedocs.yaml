version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  apt_packages:
    # PyOpenGL's `from OpenGL import GL` (render_target.py, capture/glx_context.py)
    # dlopens libGL.so.1 at import time; without it, autodoc can't import frame2tensor at all.
    # This package is sufficient for the full sphinx-build to succeed.
    - libgl1
  jobs:
    install:
      - python -m pip install --upgrade pip
      - python -m pip install .
      - python -m pip install --group docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
